<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Work Hours Tracker</title>
  <style>
    :root {
      --primary-color: #cfea45;
      --primary-hover: #d7f53e;
      --primary-active: #c2e226;
      --success-color: #4fbdf0;
      --warning-color: #f59e0b;
      --danger-color: #ef4444;
      --text-primary: #333333;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --border-color: #e5e7eb;
      --bg-primary: #ffffff;
      --bg-secondary: #f9fafb;
      --bg-tertiary: #f3f4f6;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f2f1ef;
      min-height: 100vh;
      color: var(--text-primary);
      line-height: 1.5;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    #app-container {
      display: none;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .header {
      background: var(--bg-primary);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-lg);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .header h1 {
      margin: 0 0 16px 0;
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .header-left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
      flex: 1;
      min-width: 0;
    }

    .clockin-user-row {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0;
      background: transparent;
      border-radius: 0;
      margin-left: auto;
    }

    #currentUser {
      color: var(--text-primary);
      font-weight: 600;
      font-size: 14px;
    }

    .break-settings {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 16px;
      align-items: end;
      padding: 16px;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      width: 100%;
      box-sizing: border-box;
      max-width: 100%;
    }

    .break-settings .time-pair {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--text-secondary);
      min-width: 0;
      flex: 1;
    }

    .break-settings .time-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .break-settings .time-pair label {
      font-weight: 500;
      color: var(--text-primary);
      min-width: 40px;
    }

    .break-settings input,
    .break-settings select {
      height: 36px;
      padding: 0 8px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 14px;
      transition: all 0.2s ease;
      min-width: 0;
    }

    .break-settings select {
      flex: 1;
      min-width: 0;
    }

    .break-settings input:focus,
    .break-settings select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(106, 107, 190, 0.2);
    }

    .break-settings .time-pair span {
      color: var(--text-secondary);
      font-size: 14px;
    }

    #saveSettingsBtn {
      height: 36px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-primary);
      padding: 20px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      transition: all 0.3s ease;
      border: 1px solid var(--border-color);
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .stat-card h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--primary-color);
    }

    .calendar-card {
      background: var(--bg-primary);
      padding: 24px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      margin-bottom: 24px;
    }

    .calendar-controls {
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
    }

    .calendar-controls select {
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .calendar-controls select:hover {
      border-color: var(--primary-color);
    }

    .calendar-controls select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(106, 107, 190, 0.2);
    }

    .calendar-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border-color);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .day {
      border: 1px solid var(--border-color);
      padding: 8px;
      min-height: 70px;
      cursor: pointer;
      position: relative;
      border-radius: var(--radius-sm);
      background: var(--bg-primary);
      transition: all 0.2s ease;
    }

    .day:hover:not(.empty-day) {
      border-color: var(--primary-color);
      background: rgba(106, 107, 190, 0.05);
    }

    .day.today .date {
      color: var(--primary-color);
      font-weight: 700;
      font-size: 16px;
    }

    .day.selected {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-active) 100%);
      color: #ffffff;
      border-color: transparent;
    }

    .day.selected .date {
      color: #ffffff;
    }

    .day.selected .hours {
      color: #ffffff;
    }

    .empty-day {
      background: var(--bg-tertiary);
      border: none;
      cursor: default;
    }

    .date {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .hours {
      font-size: 11px;
      margin-top: 4px;
      color: var(--text-secondary);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      position: absolute;
      top: 6px;
      right: 6px;
    }

    .ok { background-color: var(--success-color); }
    .single { background-color: var(--warning-color); }
    .none { background-color: transparent; }

    .details-card {
      background: var(--bg-primary);
      padding: 24px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
    }

    .details-card h3 {
      margin: 0 0 20px 0;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
    }

    .time-list {
      list-style: none;
      padding: 0;
      margin: 0 0 16px 0;
    }

    .time-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text-primary);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }

    .modal-content {
      background-color: var(--bg-primary);
      margin: 10% auto;
      padding: 32px;
      width: 400px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }

    .modal-content h3 {
      margin: 0 0 24px 0;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* ============================================
       Button Styles - Global & Reusable
       ============================================ */
    
    /* Primary Button - Green/Colored with dark text */
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-hover) 100%);
      border: none;
      color: var(--text-primary);
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--primary-hover) 0%, var(--primary-color) 100%);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    /* Outline Button - White/Light with border */
    .btn-outline {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-outline:hover {
      border-color: var(--border-color);
      color: var(--text-primary);
      background: rgba(106, 107, 190, 0.1);
    }

    .btn-outline:active {
      transform: translateY(0);
    }

    /* Icon Button - Red delete button */
    .btn-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: var(--danger-color);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-icon:hover {
      background: #dc2626;
      transform: scale(1.05);
    }

    .btn-icon:active {
      transform: scale(0.95);
    }

    /* Settings Icon Button */
    .btn-icon-settings {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn-icon-settings:hover {
      border-color: var(--border-color);
      color: var(--text-primary);
      background: rgba(106, 107, 190, 0.1);
      transform: translateY(01px);
      box-shadow: var(--shadow-sm);
    }

    .btn-icon-settings:active {
      transform: translateY(0);
    }

    .btn-icon-settings.active {
      background: var(--primary-color);
      border-color: var(--primary-color);
      color:var(--text-primary)e;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .form-control {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg-primary);
      transition: all 0.2s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(106, 107, 190, 0.2);
    }

    /* Login Container Specific Styles */
    #login-container {
      width: 400px;
      margin: 100px auto;
      padding: 40px;
      background: var(--bg-primary);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }

    #login-container h2 {
      margin: 0 0 24px 0;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      color: var(--text-primary);
    }

    #login-container .form-group label {
      display: block;
      text-align: left;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    #login-container .btn-primary,
    #login-container .btn-outline {
      width: 100%;
      padding: 12px;
      font-size: 14px;
    }

    #login-error, #register-error, #forgot-error, #reset-error {
      margin-top: 12px;
      color: var(--danger-color);
      font-size: 14px;
    }

    .loading-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Tablet responsive */
    @media (max-width: 1024px) {
      .break-settings {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        width: 100%;
      }

      #saveSettingsBtn {
        grid-column: 1 / -1;
        width: 100%;
      }

      .break-settings select {
        min-width: 45px;
        max-width: 60px;
      }
    }

    @media (max-width: 768px) {
      #app-container {
        padding: 16px;
      }

      .header {
        flex-direction: column;
        padding: 20px;
      }

      .header-left {
        width: 100%;
      }

      .clockin-user-row {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 12px;
      }

      .clockin-user-row .btn-primary {
        flex: 0 0 auto;
      }

      .btn-icon-settings {
        width: 38px;
        height: 38px;
      }

      .header-right {
        margin-left: 0;
        flex: 1;
        justify-content: flex-end;
      }

      .break-settings {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 12px;
        width: 100%;
      }

      .break-settings .time-pair {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: flex-start;
        gap: 6px;
        width: 100%;
      }

      .break-settings .time-pair label {
        min-width: 100%;
        margin-bottom: 4px;
        font-size: 13px;
      }

      .break-settings select {
        flex: 1;
        min-width: 0;
        max-width: none;
        height: 34px;
        font-size: 13px;
      }

      .break-settings .time-pair span {
        flex: 0 0 auto;
        font-size: 13px;
      }

      #saveSettingsBtn {
        width: 100%;
        margin-top: 8px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .calendar-card,
      .details-card {
        padding: 16px;
      }

      .day {
        min-height: 60px;
        padding: 6px;
      }

      .modal-content {
        width: calc(100% - 32px);
        margin: 20% auto;
        padding: 24px;
      }

      #login-container {
        width: calc(100% - 32px);
        margin: 40px auto;
        padding: 32px;
      }
    }

    /* Extra small screens - Ultra compact layout */
    @media (max-width: 380px) {
      .break-settings .time-pair {
        display: block;
      }

      .break-settings .time-pair label {
        display: block;
        width: 100%;
        margin-bottom: 6px;
        font-size: 12px;
      }

      .break-settings .time-row {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        margin-bottom: 6px;
      }

      .break-settings .time-row:last-child {
        margin-bottom: 0;
      }

      .break-settings .time-row select {
        flex: 1;
        min-width: 0;
        height: 34px;
        font-size: 12px;
      }

      .break-settings .time-row span {
        font-size: 12px;
        flex: 0 0 auto;
      }

      .break-settings {
        padding: 10px;
        gap: 10px;
      }
    }

    /* Responsive time selects for all screen sizes */
    .break-settings .time-pair select {
      flex: 1;
      min-width: 0;
      max-width: none;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="login-container">
    <div id="login-section">
      <h2>登录</h2>
      <div class="form-group">
        <label for="loginEmail">用户名或邮箱</label>
        <input id="loginEmail" type="text" class="form-control" placeholder="请输入用户名或邮箱">
      </div>
      <div class="form-group">
        <label for="loginPassword">密码</label>
        <input id="loginPassword" type="password" class="form-control" placeholder="请输入密码">
      </div>
      <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; font-size: 14px;">
        <label for="rememberUsername" style="display: flex; align-items: center; gap: 6px; font-weight: normal; color: var(--text-secondary); cursor: pointer;">
          <input type="checkbox" id="rememberUsername" style="width: 16px; height: 16px; cursor: pointer;">
          记住用户名
        </label>
      </div>
      <button id="loginBtn" class="btn-primary" onclick="handleLogin()" style="width: 100%; position: relative;">
        <span id="loginBtnText">登录</span>
        <span id="loginSpinner" class="loading-spinner"></span>
      </button>
      <div style="margin-top: 12px;">
        <button class="btn-outline" onclick="showRegister()" style="width: 100%;">注册新用户</button>
      </div>
      <div style="margin-top: 12px;">
        <button class="btn-outline" onclick="showForgotPassword()" style="width: 100%;">忘记密码</button>
      </div>
      <p id="login-error"></p>
    </div>

    <div id="register-section" style="display: none;">
      <h2>注册</h2>
      <div class="form-group">
        <label for="registerUsername">用户名</label>
        <input id="registerUsername" type="text" class="form-control" placeholder="请输入用户名">
      </div>
      <div class="form-group">
        <label for="registerEmail">邮箱</label>
        <input id="registerEmail" type="email" class="form-control" placeholder="请输入邮箱">
      </div>
      <div class="form-group">
        <label for="registerPassword">密码</label>
        <input id="registerPassword" type="password" class="form-control" placeholder="请输入密码">
      </div>
      <button class="btn-primary" onclick="handleRegister()" style="width: 100%;">注册并发送确认邮件</button>
      <div style="margin-top: 12px;">
        <button class="btn-outline" onclick="hideRegister()" style="width: 100%;">返回登录</button>
      </div>
      <p id="register-error"></p>
    </div>

    <div id="forgot-section" style="display: none;">
      <h2>找回密码</h2>
      <div class="form-group">
        <label for="forgotEmail">邮箱</label>
        <input id="forgotEmail" type="email" class="form-control" placeholder="请输入邮箱">
      </div>
      <button id="forgotSendBtn" class="btn-primary" onclick="sendPasswordResetEmail()" style="width: 100%;">发送重置邮件</button>
      <div style="margin-top: 12px;">
        <button class="btn-outline" onclick="hideForgotPassword()" style="width: 100%;">返回登录</button>
      </div>
      <p id="forgot-error"></p>
    </div>

    <div id="reset-section" style="display: none;">
      <h2>重置密码</h2>
      <div class="form-group">
        <label for="resetNewPassword">新密码</label>
        <input id="resetNewPassword" type="password" class="form-control" placeholder="请输入新密码（至少 6 位）">
      </div>
      <button class="btn-primary" onclick="handleUpdatePassword()" style="width: 100%;">更新密码</button>
      <div style="margin-top: 12px;">
        <button class="btn-outline" onclick="hideResetPassword()" style="width: 100%;">返回登录</button>
      </div>
      <p id="reset-error"></p>
    </div>
  </div>

  <div id="app-container">
    <header class="header">
      <div class="header-left">
        <h1>工时记录器</h1>
        <div class="clockin-user-row">
          <button class="btn-primary" onclick="clockIn()">打卡</button>
          <button class="btn-icon-settings" onclick="toggleBreakSettings()" title="休息设置">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
              <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/>

  <script>
    // --- State Management ---
    let selectedYear = new Date().getFullYear();
    let selectedMonth = new Date().getMonth();

    let currentUsername = null;
    let workDataCache = {};
    let workDataCacheKey = null;
    let renderSeq = 0;
    let forgotCooldownTimer = null;
    let forgotCooldownUntil = 0;
    let isPasswordRecoveryFlow = false;

    const SUPABASE_URL = 'https://rmuzdaknrjrhettqnfai.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_tUx4wW7WU78eVtPCm2cS0w_PkFxEk9x';
    const supabaseClient = (window.supabase && typeof window.supabase.createClient === 'function')
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
      : null;
    window.supabaseClient = supabaseClient;

    // --- Core Functions ---
    function formatDateLocal(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getTodayKey() {
      return formatDateLocal(new Date());
    }

    function normalizeTimes(items) {
      return (items || []).map((x) => (typeof x === 'string' ? x : x.ts));
    }

    function normalizeEmail(value) {
      return String(value || '').trim().toLowerCase();
    }

    function getBreakSettingsStorageKey() {
      return currentUsername ? `breakSettings_${currentUsername}` : 'breakSettings_default';
    }

    function sanitizeTimeText(value, fallbackValue) {
      const t = String(value || '').trim();
      return /^\d{2}:\d{2}$/.test(t) ? t : fallbackValue;
    }

    function ensureTimeSelectOptions(hourId, minuteId) {
      const hourEl = document.getElementById(hourId);
      const minuteEl = document.getElementById(minuteId);
      if (!hourEl || !minuteEl) return;
      if (hourEl.options.length === 24 && minuteEl.options.length === 60) return;

      hourEl.innerHTML = '';
      for (let h = 0; h < 24; h++) {
        const opt = document.createElement('option');
        opt.value = String(h).padStart(2, '0');
        opt.textContent = String(h).padStart(2, '0');
        hourEl.appendChild(opt);
      }

      minuteEl.innerHTML = '';
      for (let m = 0; m < 60; m++) {
        const opt = document.createElement('option');
        opt.value = String(m).padStart(2, '0');
        opt.textContent = String(m).padStart(2, '0');
        minuteEl.appendChild(opt);
      }
    }

    function ensureAllTimeSelectOptions() {
      ensureTimeSelectOptions('lunchStartHour', 'lunchStartMinute');
      ensureTimeSelectOptions('lunchEndHour', 'lunchEndMinute');
      ensureTimeSelectOptions('dinnerStartHour', 'dinnerStartMinute');
      ensureTimeSelectOptions('dinnerEndHour', 'dinnerEndMinute');
    }

    function ensureManualTimeOptions() {
      ensureTimeSelectOptions('manualHour', 'manualMinute');
    }

    function getTimeFromSelect(hourId, minuteId, fallbackValue) {
      const fallback = sanitizeTimeText(fallbackValue, '00:00');
      const fallbackHour = fallback.slice(0, 2);
      const fallbackMinute = fallback.slice(3, 5);
      const hourEl = document.getElementById(hourId);
      const minuteEl = document.getElementById(minuteId);
      const hh = hourEl ? String(hourEl.value || fallbackHour).padStart(2, '0') : fallbackHour;
      const mm = minuteEl ? String(minuteEl.value || fallbackMinute).padStart(2, '0') : fallbackMinute;
      return sanitizeTimeText(`${hh}:${mm}`, fallback);
    }

    function setTimeToSelect(hourId, minuteId, timeText) {
      const safeText = sanitizeTimeText(timeText, '00:00');
      const hh = safeText.slice(0, 2);
      const mm = safeText.slice(3, 5);
      const hourEl = document.getElementById(hourId);
      const minuteEl = document.getElementById(minuteId);
      if (hourEl) hourEl.value = hh;
      if (minuteEl) minuteEl.value = mm;
    }

    function getManualTimeText() {
      return getTimeFromSelect('manualHour', 'manualMinute', '09:00');
    }

    function handleManualTimeChange() {
      const t = getManualTimeText();
      setTimeToSelect('manualHour', 'manualMinute', t);
    }

    function readBreakSettingsFromInputs() {
      return {
        lunchStart: getTimeFromSelect('lunchStartHour', 'lunchStartMinute', '12:00'),
        lunchEnd: getTimeFromSelect('lunchEndHour', 'lunchEndMinute', '13:00'),
        dinnerStart: getTimeFromSelect('dinnerStartHour', 'dinnerStartMinute', '18:00'),
        dinnerEnd: getTimeFromSelect('dinnerEndHour', 'dinnerEndMinute', '18:30')
      };
    }

    function syncBreakSettingsToInputs(settings) {
      ensureAllTimeSelectOptions();
      setTimeToSelect('lunchStartHour', 'lunchStartMinute', settings.lunchStart);
      setTimeToSelect('lunchEndHour', 'lunchEndMinute', settings.lunchEnd);
      setTimeToSelect('dinnerStartHour', 'dinnerStartMinute', settings.dinnerStart);
      setTimeToSelect('dinnerEndHour', 'dinnerEndMinute', settings.dinnerEnd);
    }

    async function loadBreakSettingsFromLocalStorage(defaultSettings) {
      const raw = localStorage.getItem(getBreakSettingsStorageKey());
      if (!raw) return defaultSettings;
      try {
        const parsed = JSON.parse(raw);
        return {
          lunchStart: sanitizeTimeText(parsed.lunchStart, defaultSettings.lunchStart),
          lunchEnd: sanitizeTimeText(parsed.lunchEnd, defaultSettings.lunchEnd),
          dinnerStart: sanitizeTimeText(parsed.dinnerStart, defaultSettings.dinnerStart),
          dinnerEnd: sanitizeTimeText(parsed.dinnerEnd, defaultSettings.dinnerEnd),
        };
      } catch (e) {
        return defaultSettings;
      }
    }

    async function loadBreakSettingsFromDB(defaultSettings) {
      try {
        const { data, error } = await supabaseClient
          .from('user_break_settings')
          .select('lunch_start, lunch_end, dinner_start, dinner_end')
          .eq('username', currentUsername)
          .single();

        if (error || !data) {
          return await loadBreakSettingsFromLocalStorage(defaultSettings);
        }
        
        return {
          lunchStart: sanitizeTimeText(data.lunch_start, defaultSettings.lunchStart),
          lunchEnd: sanitizeTimeText(data.lunch_end, defaultSettings.lunchEnd),
          dinnerStart: sanitizeTimeText(data.dinner_start, defaultSettings.dinnerStart),
          dinnerEnd: sanitizeTimeText(data.dinner_end, defaultSettings.dinnerEnd),
        };
      } catch (e) {
        console.error('Failed to load break settings from DB:', e);
        return await loadBreakSettingsFromLocalStorage(defaultSettings);
      }
    }

    async function loadBreakSettings() {
      const defaultSettings = { lunchStart: '12:00', lunchEnd: '13:00', dinnerStart: '18:00', dinnerEnd: '18:30' };
      if (!currentUsername) return defaultSettings;

      if (supabaseClient) {
        return await loadBreakSettingsFromDB(defaultSettings);
      }
      
      return await loadBreakSettingsFromLocalStorage(defaultSettings);
    }

    async function saveBreakSettings(breakSettings) {
      localStorage.setItem(getBreakSettingsStorageKey(), JSON.stringify(breakSettings));

      if (!currentUsername || !supabaseClient) return;

      try {
        const { data: existing } = await supabaseClient
          .from('user_break_settings')
          .select('id')
          .eq('username', currentUsername)
          .single();

        if (existing) {
          const { error } = await supabaseClient
            .from('user_break_settings')
            .update({
              lunch_start: breakSettings.lunchStart,
              lunch_end: breakSettings.lunchEnd,
              dinner_start: breakSettings.dinnerStart,
              dinner_end: breakSettings.dinnerEnd,
              updated_at: new Date().toISOString()
            })
            .eq('username', currentUsername);

          if (error) {
            console.error('Failed to update break settings:', error);
          }
        } else {
          const { error } = await supabaseClient
            .from('user_break_settings')
            .insert({
              username: currentUsername,
              lunch_start: breakSettings.lunchStart,
              lunch_end: breakSettings.lunchEnd,
              dinner_start: breakSettings.dinnerStart,
              dinner_end: breakSettings.dinnerEnd
            });

          if (error) {
            console.error('Failed to insert break settings:', error);
          }
        }
      } catch (e) {
        console.error('Failed to save break settings:', e);
      }
    }

    async function handleBreakSettingsChange() {
      const newSettings = readBreakSettingsFromInputs();
      syncBreakSettingsToInputs(newSettings);
      await render();
    }

    async function saveSettings() {
      const btn = document.getElementById('saveSettingsBtn');
      if (!btn) return;

      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = '保存中...';

      try {
        const newSettings = readBreakSettingsFromInputs();
        syncBreakSettingsToInputs(newSettings);
        await saveBreakSettings(newSettings);
        btn.textContent = '已保存！';
        setTimeout(() => {
          btn.textContent = originalText;
          btn.disabled = false;
        }, 1500);
      } catch (e) {
        console.error('Failed to save settings:', e);
        btn.textContent = '保存失败';
        setTimeout(() => {
          btn.textContent = originalText;
          btn.disabled = false;
        }, 2000);
      }
      
      await render();
    }

    function isRecoveryFlowFromUrl() {
      const hash = (window.location.hash || '').toLowerCase();
      const search = (window.location.search || '').toLowerCase();
      return hash.includes('type=recovery') || search.includes('type=recovery');
    }

    function setForgotButtonState(disabled, text) {
      const btn = document.getElementById('forgotSendBtn');
      if (!btn) return;
      btn.disabled = !!disabled;
      btn.textContent = text || '发送重置邮件';
    }

    function startForgotCooldown(seconds) {
      const safeSeconds = Math.max(1, Number(seconds) || 1);
      forgotCooldownUntil = Date.now() + safeSeconds * 1000;

      if (forgotCooldownTimer) {
        clearInterval(forgotCooldownTimer);
        forgotCooldownTimer = null;
      }

      const tick = () => {
        const left = Math.ceil((forgotCooldownUntil - Date.now()) / 1000);
        if (left <= 0) {
          setForgotButtonState(false, '发送重置邮件');
          clearInterval(forgotCooldownTimer);
          forgotCooldownTimer = null;
          return;
        }
        setForgotButtonState(true, `请稍后重试（${left}s）`);
      };

      tick();
      forgotCooldownTimer = setInterval(tick, 1000);
    }

    function getLocalData() {
      if (!currentUsername) return {};
      const key = `workData_${currentUsername}`;
      return JSON.parse(localStorage.getItem(key) || '{}');
    }

    function saveLocalData(data) {
      if (!currentUsername) return;
      const key = `workData_${currentUsername}`;
      localStorage.setItem(key, JSON.stringify(data));
    }

    function getCacheKey(year, month) {
      if (!currentUsername) return null;
      return `${currentUsername}__${year}-${String(month + 1).padStart(2, '0')}`;
    }

    async function loadMonthData(year, month) {
      if (!currentUsername) return {};

      if (!supabaseClient) {
        const local = getLocalData();
        const start = new Date(year, month, 1);
        const end = new Date(year, month + 1, 1);
        const out = {};
        for (const [dateKey, times] of Object.entries(local)) {
          const dateObj = new Date(`${dateKey}T00:00:00`);
          if (dateObj >= start && dateObj < end) {
            out[dateKey] = (times || []).slice();
          }
        }
        return out;
      }

      const startIso = new Date(year, month, 1, 0, 0, 0).toISOString();
      const endIso = new Date(year, month + 1, 1, 0, 0, 0).toISOString();

      const { data, error } = await supabaseClient
        .from('time_entries')
        .select('id, entry_ts')
        .eq('username', currentUsername)
        .gte('entry_ts', startIso)
        .lt('entry_ts', endIso)
        .order('entry_ts', { ascending: true });

      if (error) throw error;

      const out = {};
      for (const row of (data || [])) {
        const dateKey = formatDateLocal(new Date(row.entry_ts));
        if (!out[dateKey]) out[dateKey] = [];
        out[dateKey].push({ id: row.id, ts: row.entry_ts });
      }
      return out;
    }

    async function ensureMonthLoaded(year, month) {
      const key = getCacheKey(year, month);
      if (!key) return;
      if (workDataCacheKey === key) return;

      workDataCacheKey = key;
      workDataCache = {};

      try {
        workDataCache = await loadMonthData(year, month);
      } catch (e) {
        console.error(e);
        workDataCache = {};
      }
    }

    function getData() {
      if (!currentUsername) return {};
      return workDataCache || {};
    }

    function showRegister() {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('register-section').style.display = 'block';

      document.getElementById('reset-section').style.display = 'none';

      document.getElementById('forgot-section').style.display = 'none';
      document.getElementById('register-section').style.display = 'none';
      document.getElementById('reset-section').style.display = 'none';
      document.getElementById('login-section').style.display = 'block';
      document.getElementById('forgot-error').textContent = '';
    }

    async function loadUsernameForSession(session) {
      if (!supabaseClient || !session || !session.user) return null;
      const authUserId = session.user.id;
      const { data, error } = await supabaseClient
        .from('app_users')
        .select('username')
        .eq('auth_user_id', authUserId)
        .limit(1);
      if (error) return (session.user.user_metadata && session.user.user_metadata.username) ? session.user.user_metadata.username : null;
      if (!data || data.length === 0) return (session.user.user_metadata && session.user.user_metadata.username) ? session.user.user_metadata.username : null;
      return data[0].username || null;
    }

    async function loadEmailByUsername(username) {
      if (!supabaseClient) return null;
      const cleanUsername = String(username || '').trim();
      if (!cleanUsername) return null;
      const { data, error } = await supabaseClient.rpc('get_login_email_by_username', {
        p_username: cleanUsername
      });
      if (error || !data) return null;
      return normalizeEmail(data);
    }

    async function ensureAppUserForSession(session, preferredUsername, preferredEmail) {
      if (!supabaseClient || !session || !session.user) return;

      const authUserId = session.user.id;
      const metadataUsername = session.user.user_metadata && session.user.user_metadata.username
        ? String(session.user.user_metadata.username).trim()
        : '';
      const username = String(preferredUsername || metadataUsername || '').trim();
      const email = normalizeEmail(preferredEmail || session.user.email);

      const { data: existing, error: existingError } = await supabaseClient
        .from('app_users')
        .select('id, username, email')
        .eq('auth_user_id', authUserId)
        .limit(1);

      if (existingError) {
        console.warn('load app_users failed:', existingError.message || existingError);
        return;
      }

      if (existing && existing.length > 0) {
        const row = existing[0];
        const nextUsername = row.username || username;
        const nextEmail = normalizeEmail(row.email || email);
        const needsUpdate = nextUsername !== row.username || nextEmail !== normalizeEmail(row.email);
        if (needsUpdate) {
          const { error: updateError } = await supabaseClient
            .from('app_users')
            .update({ username: nextUsername, email: nextEmail })
            .eq('id', row.id);
          if (updateError) {
            console.warn('update app_users failed:', updateError.message || updateError);
          }
        }
        return;
      }

      if (!username) return;
    }

      isPasswordRecoveryFlow = true;
      document.getElementById('app-container').style.display = 'none';

      document.getElementById('forgot-section').style.display = 'none';
      document.getElementById('login-section').style.display = 'block';
      document.getElementById('reset-error').textContent = '';

    async function handleRegister() {
      const errorEl = document.getElementById('register-error');
      errorEl.textContent = '';

      if (!supabaseClient) {
        errorEl.textContent = 'Supabase 未初始化，无法注册';
        return;
      }

      const username = document.getElementById('registerUsername').value.trim();
      const email = normalizeEmail(document.getElementById('registerEmail').value);
      const password = document.getElementById('registerPassword').value;

      if (!username) {
        errorEl.textContent = '请输入用户名';
        return;
      }
      if (!email) {
        errorEl.textContent = '请输入邮箱';
        return;
      }
      if (!password || password.length < 6) {
        errorEl.textContent = '密码至少需要 6 位';
        return;
      }

      const existsEmail = await loadEmailByUsername(username);
      if (existsEmail) {
        errorEl.textContent = '用户名已存在，请更换用户名';
        return;
      }

      const { data: signUpData, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: { username },
          emailRedirectTo: window.location.origin + window.location.pathname
        }
      });
      if (error) {
        errorEl.textContent = error.message;
        return;
      }

      hideRegister();
      document.getElementById('loginPassword').value = '';
      document.getElementById('loginEmail').value = email;
      document.getElementById('login-error').textContent = '确认邮件已发送，请到邮箱点击链接完成注册；首次登录后会自动创建用户档案';
    }

    async function sendPasswordResetEmail() {
      const errorEl = document.getElementById('forgot-error');
      errorEl.textContent = '';
      if (Date.now() < forgotCooldownUntil) {
        const left = Math.ceil((forgotCooldownUntil - Date.now()) / 1000);
        errorEl.textContent = `操作过于频繁，请 ${left} 秒后再试`;
        return;
      }

      if (!supabaseClient) {
        errorEl.textContent = 'Supabase 未初始化，无法发送重置邮件';
        return;
      }

      const email = normalizeEmail(document.getElementById('forgotEmail').value);
      if (!email) {
        errorEl.textContent = '请输入邮箱';
        return;
      }

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + window.location.pathname
      });
      if (error) {
        const msg = String(error.message || '').toLowerCase();
        if (msg.includes('rate limit')) {
          errorEl.textContent = '邮件发送过于频繁，请稍后再试';
          startForgotCooldown(60);
          return;
        }
        errorEl.textContent = error.message;
        return;
      }

      errorEl.textContent = '重置邮件已发送，请到邮箱中完成密码重置';
      startForgotCooldown(60);
    }

    async function handleUpdatePassword() {
      const errorEl = document.getElementById('reset-error');
      errorEl.textContent = '';

      if (!supabaseClient) {
        errorEl.textContent = 'Supabase 未初始化，无法更新密码';
        return;
      }

      const newPassword = document.getElementById('resetNewPassword').value;
      if (!newPassword || newPassword.length < 6) {
        errorEl.textContent = '新密码至少需要 6 位';
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
      if (error) {
        errorEl.textContent = error.message;
        return;
      }

      await supabaseClient.auth.signOut();
      hideResetPassword();
      document.getElementById('loginPassword').value = '';
      document.getElementById('login-error').textContent = '密码已更新，请重新登录';
    }

    async function handleLogin() {
      const errorEl = document.getElementById('login-error');
      errorEl.textContent = '';

      const account = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const rememberUsername = document.getElementById('rememberUsername').checked;

      if (!account) {
        errorEl.textContent = '请输入用户名或邮箱';
        return;
      }
      if (!password) {
        errorEl.textContent = '请输入密码';
        return;
      }
      if (!supabaseClient) {
        errorEl.textContent = 'Supabase 未初始化，无法登录';
        return;
      }

      const loginBtn = document.getElementById('loginBtn');
      const loginBtnText = document.getElementById('loginBtnText');
      const loginSpinner = document.getElementById('loginSpinner');
      loginBtn.disabled = true;
      loginBtnText.style.display = 'none';
      loginSpinner.style.display = 'block';

      let loginEmail = normalizeEmail(account);
      
      if (!account.includes('@')) {
        const cachedEmail = localStorage.getItem('username_email_' + account.toLowerCase());
        if (cachedEmail) {
          loginEmail = normalizeEmail(cachedEmail);
        } else {
          const mappedEmail = await loadEmailByUsername(account);
          if (!mappedEmail) {
            errorEl.textContent = '用户名不存在';
            loginBtn.disabled = false;
            loginBtnText.style.display = 'inline';
            loginSpinner.style.display = 'none';
            return;
          }
          loginEmail = mappedEmail;
          localStorage.setItem('username_email_' + account.toLowerCase(), loginEmail);
        }
      }

      const { error } = await supabaseClient.auth.signInWithPassword({ email: loginEmail, password });
      if (error) {
        errorEl.textContent = error.message;
        loginBtn.disabled = false;
        loginBtnText.style.display = 'inline';
        loginSpinner.style.display = 'none';
        return;
      }

      if (rememberUsername) {
        localStorage.setItem('rememberedUsername', account);
      } else {
        localStorage.removeItem('rememberedUsername');
      }

      const { data } = await supabaseClient.auth.getSession();
      const session = data ? data.session : null;
      
      const metadataUsername = session && session.user && session.user.user_metadata && session.user.user_metadata.username
        ? String(session.user.user_metadata.username).trim()
        : '';
      
      currentUsername = metadataUsername || loginEmail;
      workDataCache = {};
      workDataCacheKey = null;
      
      loginBtn.disabled = false;
      loginBtnText.style.display = 'inline';
      loginSpinner.style.display = 'none';
      
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('app-container').style.display = 'block';
      document.getElementById('currentUser').textContent = `用户: ${currentUsername}`;
      await initApp();
      
      setTimeout(async () => {
        try {
          await ensureAppUserForSession(session, account.includes('@') ? '' : account, loginEmail);
        } catch (e) {
          console.warn('ensure app user failed:', (e && e.message) ? e.message : e);
        }
        
        try {
          const dbUsername = await loadUsernameForSession(session);
          if (dbUsername && dbUsername !== currentUsername) {
            currentUsername = dbUsername;
            document.getElementById('currentUser').textContent = `用户: ${currentUsername}`;
            await render();
          }
        } catch (e) {
          console.warn('load username failed:', (e && e.message) ? e.message : e);
        }
      }, 100);
    }

    async function handleLogout() {
      currentUsername = null;
      workDataCache = {};
      workDataCacheKey = null;

      if (supabaseClient) {
        await supabaseClient.auth.signOut();
      }

      document.getElementById('login-container').style.display = 'block';
      document.getElementById('app-container').style.display = 'none';

      const rememberedUsername = localStorage.getItem('rememberedUsername');
      if (rememberedUsername) {
        document.getElementById('loginEmail').value = rememberedUsername;
        document.getElementById('rememberUsername').checked = true;
      }
      document.getElementById('loginPassword').value = '';
    }

    async function checkLoginState() {
      if (supabaseClient) {
        supabaseClient.auth.onAuthStateChange((event) => {
          if (event === 'PASSWORD_RECOVERY') {
            isPasswordRecoveryFlow = true;
            showResetPassword();
          }
        });

        let session = null;
        try {
          const { data, error } = await supabaseClient.auth.getSession();
          if (error) throw error;
          session = data ? data.session : null;
        } catch (error) {
          console.error("Failed to get session, signing out:", error);
          await supabaseClient.auth.signOut();
          session = null;
        }

        if (isPasswordRecoveryFlow || isRecoveryFlowFromUrl()) {
          showResetPassword();
          return;
        }

        if (session && session.user) {
          try {
            await ensureAppUserForSession(session, '', session.user.email);
          } catch (e) {
            console.error(e);
          }
          const u = await loadUsernameForSession(session);
          currentUsername = u || session.user.email;
          workDataCache = {};
          workDataCacheKey = null;
          document.getElementById('login-container').style.display = 'none';
          document.getElementById('app-container').style.display = 'block';
          document.getElementById('currentUser').textContent = `用户: ${currentUsername}`;
          await initApp();
          return;
        }
      }

      document.getElementById('login-container').style.display = 'block';
      document.getElementById('app-container').style.display = 'none';

      const rememberedUsername = localStorage.getItem('rememberedUsername');
      if (rememberedUsername) {
        document.getElementById('loginEmail').value = rememberedUsername;
        document.getElementById('rememberUsername').checked = true;
      }
    }

    async function clockIn() {
      await ensureMonthLoaded(selectedYear, selectedMonth);
      const data = getData();
      const nowIso = new Date().toISOString();
      const today = formatDateLocal(new Date(nowIso));

      if (!supabaseClient) {
        if (!data[today]) data[today] = [];
        data[today].push(nowIso);
        saveLocalData({ ...getLocalData(), [today]: data[today] });
        render();
        return;
      }

      const { data: inserted, error } = await supabaseClient
        .from('time_entries')
        .insert({ username: currentUsername, entry_ts: nowIso })
        .select('id, entry_ts')
        .single();

      if (error) {
        alert(error.message);
        return;
      }

      if (!data[today]) data[today] = [];
      data[today].push({ id: inserted.id, ts: inserted.entry_ts });
      render();
    }

    async function manualAdd() {
      const date = document.getElementById('manualDate').value;
      const time = getManualTimeText();
      if (!date || !time) return alert('请选择日期和时间');

      await ensureMonthLoaded(selectedYear, selectedMonth);
      const data = getData();
      const tsIso = new Date(`${date}T${time}`).toISOString();

      if (!supabaseClient) {
        if (!data[date]) data[date] = [];
        data[date].push(tsIso);
        saveLocalData({ ...getLocalData(), [date]: data[date] });
        hideManualModal();
        render();
        return;
      }

      const { data: inserted, error } = await supabaseClient
        .from('time_entries')
        .insert({ username: currentUsername, entry_ts: tsIso })
        .select('id, entry_ts')
        .single();

      if (error) {
        alert(error.message);
        return;
      }

      if (!data[date]) data[date] = [];
      data[date].push({ id: inserted.id, ts: inserted.entry_ts });
      hideManualModal();
      render();
    }

    async function deleteTime(date, idOrIndex) {
      await ensureMonthLoaded(selectedYear, selectedMonth);
      const data = getData();
      const list = data[date] || [];

      if (!supabaseClient) {
        if (typeof idOrIndex === 'number') {
          list.splice(idOrIndex, 1);
          data[date] = list;
          saveLocalData({ ...getLocalData(), [date]: list });
        }
        render();
        return;
      }

      const entryId = String(idOrIndex);
      const { error } = await supabaseClient
        .from('time_entries')
        .delete()
        .eq('id', entryId)
        .eq('username', currentUsername);

      if (error) {
        alert(error.message);
        return;
      }

      data[date] = list.filter((x) => (typeof x === 'string' ? true : x.id !== entryId));
      render();
    }

    async function selectDate(dateStr) {
      currentSelectedDate = dateStr;
      await render();
    }

    async function onMonthChange() {
      const yearSelect = document.getElementById('yearSelect');
      const monthSelect = document.getElementById('monthSelect');
      const newYear = parseInt(yearSelect.value, 10);
      const newMonth = parseInt(monthSelect.value, 10);

      if (newYear !== selectedYear) {
        selectedYear = newYear;
        updateMonthOptions();
        selectedMonth = parseInt(document.getElementById('monthSelect').value, 10);
      } else {
        selectedMonth = newMonth;
      }

      currentSelectedDate = formatDateLocal(new Date(selectedYear, selectedMonth, 1));
      await render();
    }

    function showManualModal() {
      ensureManualTimeOptions();
      document.getElementById('manualDate').value = currentSelectedDate;
      const now = new Date();
      const defaultTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      setTimeToSelect('manualHour', 'manualMinute', defaultTime);
      document.getElementById('manualModal').style.display = 'block';
    }

    function hideManualModal() {
      document.getElementById('manualModal').style.display = 'none';
    }

    async function render() {
      const seq = ++renderSeq;
      const currentBreakSettings = await loadBreakSettings();
      syncBreakSettingsToInputs(currentBreakSettings);

      await ensureMonthLoaded(selectedYear, selectedMonth);
      if (seq !== renderSeq) return;

      renderCalendar(currentBreakSettings);
      renderDayDetails(currentSelectedDate, currentBreakSettings);
    }

    function toggleBreakSettings() {
      const panel = document.getElementById('breakSettingsPanel');
      const btn = document.querySelector('.btn-icon-settings');
      
      if (panel.style.display === 'none' || panel.style.display === '') {
        panel.style.display = 'block';
        btn.classList.add('active');
      } else {
        panel.style.display = 'none';
        btn.classList.remove('active');
      }
    }

    async function initApp() {
      ensureAllTimeSelectOptions();
      initSelectors();
      await render();
    }

    function initSelectors() {
      const yearSelect = document.getElementById('yearSelect');
      const now = new Date();
      const currentYear = now.getFullYear();

      yearSelect.innerHTML = '';
      for (let y = 2026; y <= currentYear; y++) {
        const option = document.createElement('option');
        option.value = y;
        option.textContent = y + '年';
        yearSelect.appendChild(option);
      }
      yearSelect.value = selectedYear;
      updateMonthOptions();
    }

    function updateMonthOptions() {
      const monthSelect = document.getElementById('monthSelect');
      const year = parseInt(document.getElementById('yearSelect').value);
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth();

      const previouslySelectedMonth = selectedMonth;
      monthSelect.innerHTML = '';
      const maxMonth = (year === currentYear) ? currentMonth : 11;

      for (let m = 0; m <= maxMonth; m++) {
        const option = document.createElement('option');
        option.value = m;
        option.textContent = (m + 1) + '月';
        monthSelect.appendChild(option);
      }

      if (year === selectedYear && previouslySelectedMonth <= maxMonth) {
        monthSelect.value = previouslySelectedMonth;
      } else {
        monthSelect.value = maxMonth;
        selectedMonth = maxMonth;
      }
    }

    function renderCalendar(breakSettings) {
      const data = getData();
      const todayStr = getTodayKey();
      const year = selectedYear;
      const month = selectedMonth;

      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const offset = (firstDayOfMonth === 0) ? 6 : firstDayOfMonth - 1;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      for (let i = 0; i < offset; i++) {
        grid.insertAdjacentHTML('beforeend', '<div class="day empty-day"></div>');
      }

      let totalMonthHours = 0;
      let workingDays = 0;

      for (let i = 1; i <= daysInMonth; i++) {
        const dateObj = new Date(year, month, i);
        const dateStr = formatDateLocal(dateObj);
        const div = document.createElement('div');
        div.className = 'day';
        if (dateStr === todayStr) div.classList.add('today');
        if (dateStr === currentSelectedDate) div.classList.add('selected');
        div.onclick = () => selectDate(dateStr);

        const timesRaw = data[dateStr] || [];
        const times = normalizeTimes(timesRaw);
        const status = getStatus(times);
        const detail = calculateDayHoursDetail(times, dateStr, breakSettings);
        const hours = detail.netHours;

        if (status === 'ok') {
          totalMonthHours += hours;
          workingDays++;
        }

        let hoursText = status === 'ok' ? `${hours.toFixed(2)}h` : (status === 'single' ? '仅打卡1次' : '0h');
        let hoursColor = status === 'none' ? '#ccc' : '#333';

        div.innerHTML = `
          <div class="date">${i}</div>
          <div class="dot ${status}"></div>
          <div class="hours" style="color: ${hoursColor}">${hoursText}</div>
        `;
        grid.appendChild(div);
      }

      document.getElementById('summarySection').innerHTML = `
        <div class="stat-card">
          <h3>本月总工时</h3>
          <span class="stat-value">${totalMonthHours.toFixed(2)} h</span>
        </div>
        <div class="stat-card">
          <h3>有效出勤</h3>
          <span class="stat-value">${workingDays} 天</span>
        </div>
        <div class="stat-card">
          <h3>日均工时</h3>
          <span class="stat-value">${workingDays > 0 ? (totalMonthHours / workingDays).toFixed(2) : '0.00'} h</span>
        </div>
      `;
    }

    function renderDayDetails(date, breakSettings) {
      const data = getData();
      const timesRaw = data[date] || [];
      const times = normalizeTimes(timesRaw);
      const status = getStatus(times);

      document.getElementById('selectedDateHeader').innerText = `${date} 详情`;
      const timeEntries = document.getElementById('timeEntries');
      timeEntries.innerHTML = '';

      const ul = document.createElement('ul');
      ul.className = 'time-list';

      if (times.length === 0) {
        ul.innerHTML = '<li class="time-item">暂无打卡记录</li>';
      } else {
        const sorted = (timesRaw || []).slice().sort((a, b) => {
          const ta = (typeof a === 'string') ? a : a.ts;
          const tb = (typeof b === 'string') ? b : b.ts;
          return ta.localeCompare(tb);
        });

        sorted.forEach((t, i) => {
          const ts = (typeof t === 'string') ? t : t.ts;
          const deleteArg = (typeof t === 'string') ? i : `'${t.id}'`;
          const li = document.createElement('li');
          li.className = 'time-item';
          li.innerHTML = `
            <span>${new Date(ts).toLocaleTimeString('zh-CN', { hour12: false })}</span>
            <button class="btn-icon" onclick="deleteTime('${date}', ${deleteArg})" title="删除">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
                <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
                <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
              </svg>
            </button>
          `;
          ul.appendChild(li);
        });
      }
      timeEntries.appendChild(ul);

      const summaryDiv = document.createElement('div');
      if (status === 'ok') {
        const detail = calculateDayHoursDetail(times, date, breakSettings);
        summaryDiv.innerHTML = `
          <div style="font-weight: bold; color: var(--success-color);">当日总工时: ${detail.netHours.toFixed(2)} 小时</div>
          <div style="color: var(--text-secondary); margin-top: 4px;">打卡跨度: ${detail.totalHours.toFixed(2)} 小时，休息扣减: ${detail.deductionHours.toFixed(2)} 小时</div>
        `;
      } else if (status === 'single') {
        summaryDiv.innerHTML = '<div style="color: var(--warning-color);">记录不完整，建议补录</div>';
      }
      timeEntries.appendChild(summaryDiv);
    }

    function timeTextToMinutes(text) {
      if (!/^\d{2}:\d{2}$/.test(text)) return null;
      const [hh, mm] = text.split(':').map((x) => Number.parseInt(x, 10));
      if (!Number.isFinite(hh) || !Number.isFinite(mm)) return null;
      if (hh < 0 || hh > 23 || mm < 0 || mm > 59) return null;
      return hh * 60 + mm;
    }

    function calculateSingleBreakHours(dateKey, startText, endText, firstTs, lastTs) {
      const startMinutes = timeTextToMinutes(startText);
      const endMinutes = timeTextToMinutes(endText);
      if (startMinutes === null || endMinutes === null || endMinutes <= startMinutes) return 0;

      const startDate = new Date(firstTs);
      startDate.setHours(0, 0, 0, 0);
      const breakStartTs = new Date(startDate.getTime() + startMinutes * 60 * 1000);
      const breakEndTs = new Date(startDate.getTime() + endMinutes * 60 * 1000);

      const overlapStartMs = Math.max(firstTs.getTime(), breakStartTs.getTime());
      const overlapEndMs = Math.min(lastTs.getTime(), breakEndTs.getTime());
      if (overlapEndMs <= overlapStartMs) return 0;
      return (overlapEndMs - overlapStartMs) / (1000 * 60 * 60);
    }

    function calculateBreakDeductionHours(dateKey, firstTs, lastTs, breakSettings) {
      const lunchHours = calculateSingleBreakHours(dateKey, breakSettings.lunchStart, breakSettings.lunchEnd, firstTs, lastTs);
      const dinnerHours = calculateSingleBreakHours(dateKey, breakSettings.dinnerStart, breakSettings.dinnerEnd, firstTs, lastTs);
      return lunchHours + dinnerHours;
    }

    function calculateDayHoursDetail(times, dateKey, breakSettings) {
      if (times.length < 2) {
        return { totalHours: 0, deductionHours: 0, netHours: 0 };
      }
      const sorted = times.map(t => new Date(t)).sort((a, b) => a - b);
      const totalHours = (sorted[sorted.length - 1] - sorted[0]) / (1000 * 60 * 60);
      const firstTs = sorted[0];
      const lastTs = sorted[sorted.length - 1];
      const dayKey = dateKey || formatDateLocal(firstTs);
      const deductionHours = calculateBreakDeductionHours(dayKey, firstTs, lastTs, breakSettings);
      const netHours = Math.max(0, totalHours - deductionHours);
      return { totalHours, deductionHours, netHours };
    }

    function getStatus(times) {
      if (!times || times.length === 0) return 'none';
      if (times.length === 1) return 'single';
      return 'ok';
    }

    document.addEventListener('DOMContentLoaded', checkLoginState);

  </script>
